name: Build & push image

# Build l'image BlockSDR (front React + backend Python) et la pousse sur
# ghcr.io/calaxo/blocksdr. Le GITHUB_TOKEN du repo suffit pour publier sur ghcr
# sous le même compte (packages: write).
# Côté Komodo, la stack tire cette image avec registry_provider=ghcr.io et
# registry_account=calaxo — mêmes identifiants que surfcast.

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/blocksdr   # -> ghcr.io/calaxo/blocksdr

jobs:
  # Tests du backend : validation des entrées, DSP, client du dongle (avec une
  # fausse librtlsdr). L'image n'est construite que s'ils passent.
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances (verrouillées, empreintes vérifiées)
        run: pip install --require-hashes --only-binary=:all: -r backend/requirements-dev.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  build:
    needs: tests
    # Sur une pull request : tests seulement, rien n'est publié.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64          # l'hote de production est en amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
